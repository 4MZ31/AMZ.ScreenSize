name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate tag
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Run this workflow from the tag matching VERSION.'
          }
      - name: Build, test and package
        shell: powershell
        run: .\build.ps1 -Test -Package
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { $notes = 'CHANGELOG.md' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/* --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $assets = @(Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName)
            gh release create $tag @assets --verify-tag --title "AMZ.ScreenSize $tag" --notes-file $notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
